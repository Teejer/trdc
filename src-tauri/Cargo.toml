[package]
name = "trdc"
version = "0.1.0"
description = "trdc - tabbed remote desktop client with an AI copilot"
authors = ["teejer"]
edition = "2021"

[lib]
name = "trdc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
tokio = { version = "1", features = ["rt", "net", "io-util", "sync", "time", "process", "macros", "signal"] }
tokio-tungstenite = "0.29"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "http2"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
