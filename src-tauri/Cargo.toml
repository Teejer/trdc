[package]
name = "trdc"
version = "0.2.0"
description = "trdc - tabbed remote desktop client with an AI copilot"
authors = ["teejer"]
edition = "2021"

[lib]
name = "trdc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# tauri's custom-protocol feature embeds the built frontend into the binary.
# `tauri build` enables it automatically; plain `cargo build --release` (what
# the AUR PKGBUILD runs) must pass --features custom-protocol explicitly, or
# the app loads the dev URL localhost:1420 and dies with "Connection refused".
[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
cc = "1.8.0"
pkg-config = "0.3.34"
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
tokio = { version = "1", features = ["rt", "net", "io-util", "sync", "time", "process", "macros", "signal"] }
tokio-tungstenite = "0.29"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "http2"] }
libc = { version = "0.2.190", features = ["std"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
